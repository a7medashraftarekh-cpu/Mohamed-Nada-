<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️ Our Secret World</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a0a2e 0%, #4a1a4a 50%, #2d1b4e 100%);
            overflow: hidden;
            position: relative;
        }
        /* Floating hearts */
        .heart {
            position: absolute;
            color: rgba(255, 105, 180, 0.3);
            font-size: 20px;
            animation: floatUp linear infinite;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
        }
        /* Sparkle particles */
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ffd700;
            border-radius: 50%;
            animation: sparkle 3s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }
        .login-box {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 25px 80px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative;
            z-index: 10;
            animation: fadeInUp 1s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .lock-icon {
            font-size: 60px;
            margin-bottom: 15px;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        h1 {
            color: #fff;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(255,105,180,0.3);
        }
        .subtitle {
            color: rgba(255,255,255,0.6);
            font-size: 15px;
            margin-bottom: 30px;
        }
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }
        .input-group input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 14px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 16px;
            font-family: 'Tajawal', sans-serif;
            text-align: center;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            outline: none;
        }
        .input-group input::placeholder {
            color: rgba(255,255,255,0.3);
            letter-spacing: 0;
        }
        .input-group input:focus {
            border-color: #ff69b4;
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 20px rgba(255,105,180,0.2);
        }
        .btn-enter {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(255,20,147,0.4);
            position: relative;
            overflow: hidden;
        }
        .btn-enter:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(255,20,147,0.5);
        }
        .btn-enter:active { transform: translateY(0); }
        .btn-enter::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        .btn-enter:hover::after { left: 100%; }
        .hint {
            color: rgba(255,255,255,0.4);
            font-size: 13px;
            margin-top: 20px;
        }
        .error-msg {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 10px;
            opacity: 0;
            transition: opacity 0.3s;
            min-height: 20px;
        }
        .error-msg.show { opacity: 1; }
        .success-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            flex-direction: column;
        }
        .success-overlay.show { display: flex; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .success-heart {
            font-size: 80px;
            animation: heartbeat 1s ease-in-out infinite;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.2); }
            50% { transform: scale(1); }
            75% { transform: scale(1.15); }
        }
        .success-text {
            color: #fff;
            font-size: 24px;
            font-weight: 700;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- Floating hearts -->
    <script>
        for(let i=0; i<20; i++) {
            const h = document.createElement('div');
            h.className = 'heart';
            h.innerHTML = '❤';
            h.style.left = Math.random()*100 + 'vw';
            h.style.fontSize = (15 + Math.random()*25) + 'px';
            h.style.animationDuration = (6 + Math.random()*8) + 's';
            h.style.animationDelay = Math.random()*10 + 's';
            document.body.appendChild(h);
        }
        for(let i=0; i<30; i++) {
            const s = document.createElement('div');
            s.className = 'sparkle';
            s.style.left = Math.random()*100 + 'vw';
            s.style.top = Math.random()*100 + 'vh';
            s.style.animationDuration = (2 + Math.random()*4) + 's';
            s.style.animationDelay = Math.random()*5 + 's';
            document.body.appendChild(s);
        }
    </script>

    <div class="login-box">
        <div class="lock-icon">🔐</div>
        <h1>افتحي عالمنا</h1>
        <p class="subtitle">يا من تكون عالمي الخاص ❤️</p>
        <div class="input-group">
            <input type="password" id="password" placeholder="اكتبي كلمة المرور..." onkeypress="if(event.key==='Enter')checkPassword()">
        </div>
        <button class="btn-enter" onclick="checkPassword()">ادخلي يا حياتي 💕</button>
        <p class="error-msg" id="errorMsg">كلمة المرور غلط يا حبيبتي 😢</p>
        <p class="hint">💡 تلميح: يوم مميز بينا (يوم/شهر/سنة كاملة)</p>
    </div>

    <div class="success-overlay" id="successOverlay">
        <div class="success-heart">❤️</div>
        <p class="success-text">أهلاً بيكي يا عالمي الخاص!</p>
    </div>

    <script>
        function checkPassword() {
            const pass = document.getElementById('password').value.trim();
            const error = document.getElementById('errorMsg');
            if (pass === '9/11/2025' || pass === '9\11\2025' || pass === '9-11-2025') {
                error.classList.remove('show');
                document.getElementById('successOverlay').classList.add('show');
                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 2000);
            } else {
                error.classList.add('show');
                document.getElementById('password').style.borderColor = '#ff6b6b';
                setTimeout(() => {
                    document.getElementById('password').style.borderColor = '';
                }, 1000);
            }
        }
    </script>
</body>
</html>
