<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ صورنا</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:linear-gradient(135deg,#1a0a2e 0%,#2d1b4e 50%,#4a1a4a 100%);min-height:100vh;color:#fff;overflow-x:hidden}
.navbar{position:fixed;top:0;left:0;right:0;background:rgba(0,0,0,0.3);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.08);z-index:100;padding:15px 30px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:800}
.nav-links{display:flex;gap:8px}
.nav-links a{color:rgba(255,255,255,0.7);text-decoration:none;padding:8px 16px;border-radius:10px;font-size:14px;font-weight:500;transition:all 0.3s}
.nav-links a:hover,.nav-links a.active{color:#fff;background:rgba(255,105,180,0.2)}
.page-header{text-align:center;padding:120px 20px 40px}
.page-header h1{font-size:42px;font-weight:900;margin-bottom:10px;text-shadow:0 4px 20px rgba(255,105,180,0.3)}
.page-header p{color:rgba(255,255,255,0.6);font-size:18px}
.empty-state{max-width:500px;margin:60px auto;text-align:center;padding:50px 30px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:20px;animation:fadeInUp 0.8s ease-out}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.empty-state .icon{font-size:80px;margin-bottom:20px;display:block}
.empty-state h2{font-size:24px;font-weight:700;margin-bottom:10px}
.empty-state p{color:rgba(255,255,255,0.6);font-size:16px;line-height:1.8}
.footer{text-align:center;padding:40px 20px;color:rgba(255,255,255,0.4);font-size:14px}
@media(max-width:768px){.page-header h1{font-size:30px}}
</style>
</head>
<body>
<nav class="navbar"><div class="logo">❤️ عالمنا</div><div class="nav-links"><a href="home.html">الرئيسية</a><a href="memories.html">الذكريات</a><a href="photos.html" class="active">الصور</a><a href="videos.html">الفيديوهات</a><a href="music.html">الأغاني</a><a href="game.html">اللعبة</a></div></nav>
<div class="page-header"><h1>📸 صورنا</h1><p>معرض الصور الخاص بينا</p></div>
<div class="empty-state">
<span class="icon">📷</span>
<h2>معرض الصور</h2>
<p>هنا هنحط صورنا الجديدة مع بعض<br>كل صورة فيها قصة حب ❤️</p>
</div>
<footer class="footer"><p>❤️ كل صورة معاكي لوحة فنية</p></footer>
</body>
</html>
